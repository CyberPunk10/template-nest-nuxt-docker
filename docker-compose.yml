services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '${BACKEND_HOST_PORT}:${BACKEND_INTERNAL_PORT}'
    env_file: apps/backend/.env
    environment:
      PORT: '${BACKEND_INTERNAL_PORT}'
      CORS_ORIGIN_PORT: '${FRONTEND_HOST_PORT}'
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '${FRONTEND_HOST_PORT}:${FRONTEND_INTERNAL_PORT}'
    env_file: apps/frontend/.env
    environment:
      NUXT_PUBLIC_APP_ENV: production
      PORT: '${FRONTEND_INTERNAL_PORT}'
      # BACKEND_URL специально переопределяется здесь, а не в .env: внутри
      # Docker-сети backend недостижим по localhost — только по имени сервиса.
      BACKEND_URL: 'http://backend:${BACKEND_INTERNAL_PORT}'
      NUXT_PUBLIC_BACKEND_PORT: '${BACKEND_HOST_PORT}'
    depends_on:
      - backend
    networks:
      - app

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - '${DOCS_HOST_PORT}:${DOCS_INTERNAL_PORT}'
    env_file: apps/docs/.env
    environment:
      PORT: '${DOCS_INTERNAL_PORT}'
    networks:
      - app

networks:
  app:
    # Явное имя сети — без него Docker генерирует имя из папки проекта.
    # Фиксированное имя нужно когда к сети нужно подключить контейнеры
    # из другого compose-файла (например, отдельный compose для БД):
    #   docker network connect template-nest-nuxt_app <container>
    # или через external: true в другом compose.
    name: template-nest-nuxt_app
    external: true
