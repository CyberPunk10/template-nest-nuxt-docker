server {
    listen 80;

    # base: '/docs/' в vitepress.config.ts — ассеты и роуты рассчитаны на этот префикс.
    # Без явного location / всё, что не под /docs/, унаследовало бы root и отдавало
    # бы статику докa — вместо этого отдаём 404 на всём, что не начинается с /docs/.
    location / {
        return 404;
    }

    location /docs/ {
        alias /srv/docs/;
        try_files $uri $uri/ /docs/404.html;
    }
}
